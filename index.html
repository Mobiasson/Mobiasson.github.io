<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobiasson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --bg: #f7f6f1;
    --surface: #ffffff;
    --ink: #17181c;
    --muted: #5c5e66;
    --rule: #e2e0d6;
    --accent: #b88a00;
    --accent-bg: #ffd23f;
    --accent-ink: #17181c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e0f13; --surface: #16171c; --ink: #f2f2ec; --muted: #a3a5ad;
      --rule: #2a2c33; --accent: #ffd23f; --accent-bg: #ffd23f; --accent-ink: #0e0f13;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0f13; --surface: #16171c; --ink: #f2f2ec; --muted: #a3a5ad;
    --rule: #2a2c33; --accent: #ffd23f; --accent-bg: #ffd23f; --accent-ink: #0e0f13;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 40px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 40px; }
  header { display: grid; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 44px; height: 44px; border-radius: 50%; background: var(--accent-bg); color: var(--accent-ink);
    display: grid; place-items: center; font: 22px/1 "Archivo Black", Impact, sans-serif; flex: none;
  }
  h1 { font: 34px/1.1 "Archivo Black", Impact, sans-serif; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .lede { margin: 0; color: var(--muted); max-width: 60ch; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  nav a {
    color: var(--ink); text-decoration: none; border: 1px solid var(--rule); border-radius: 999px;
    padding: 6px 14px; font-weight: 600; font-size: 14px; background: var(--surface);
  }
  nav a:hover, nav a:focus-visible { border-color: var(--accent); outline: none; }
  section { display: grid; gap: 4px; scroll-margin-top: 24px; }
  section + section { border-top: 1px solid var(--rule); padding-top: 40px; }
  h2 { font: 24px/1.2 "Archivo Black", Impact, sans-serif; margin: 0; }
  .updated { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 20px 0 2px; }
  p, ul { margin: 0; max-width: 65ch; }
  ul { padding-left: 1.2em; }
  a { color: var(--accent); }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 0.92em; }
  footer { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand"><div class="mark" aria-hidden="true">?!</div><strong>Strangely True Uploader</strong></div><nav aria-label="Pages"></nav></header>
  <section><h1>Mobiasson</h1><p class="lede"><a href="strangely-true/">Strangely True</a></p></section>
  <footer>Strangely True &middot; One weird, true fact. Every day.</footer>
</div>
</body>
</html>
